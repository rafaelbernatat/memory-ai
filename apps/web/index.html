<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memória AI - MVP SaaS</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Memória AI</h1>
      <p>Primeira base do SaaS conforme o PRD: criação de projetos e configuração inicial.</p>

      <section class="card">
        <h2>Novo Projeto</h2>
        <form id="project-form">
          <label>Nome do homenageado
            <input required name="name" minlength="2" placeholder="Ex: Sofia" />
          </label>

          <label>Tema
            <select name="themeId" id="theme-select" required></select>
          </label>

          <label>Duração padrão das fotos (2-5s)
            <input name="photoDuration" type="number" min="2" max="5" value="3" />
          </label>

          <label>Link do YouTube (opcional)
            <input name="youtubeUrl" type="url" placeholder="https://youtube.com/watch?v=..." />
          </label>

          <button type="submit">Criar projeto</button>
        </form>
      </section>

      <section class="card">
        <h2>Projetos criados</h2>
        <ul id="projects-list"></ul>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
